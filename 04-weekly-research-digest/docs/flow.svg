<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Weekly research digest">
<title>Weekly research digest</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55605e"/></marker></defs>
<rect width="860" height="300" fill="#ffffff"/>
<text x="20" y="30" font-size="15" font-weight="700" fill="#0f2a4a">Weekly research digest</text>
<rect x="16" y="70" width="118" height="74" rx="9" fill="#f2ede1" stroke="#d8d2c4" stroke-width="1.2"/>
<text x="75.0" y="103.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f2a4a">Weekly schedule</text>
<text x="75.0" y="119.0" text-anchor="middle" font-size="11" fill="#16201f">runs once a week</text>
<rect x="156" y="70" width="118" height="74" rx="9" fill="#f2ede1" stroke="#d8d2c4" stroke-width="1.2"/>
<text x="215.0" y="95.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f2a4a">Crossref API</text>
<text x="215.0" y="111.0" text-anchor="middle" font-size="11" fill="#16201f">last 7 days,</text>
<text x="215.0" y="127.0" text-anchor="middle" font-size="11" fill="#16201f">20 results</text>
<rect x="296" y="70" width="118" height="74" rx="9" fill="#f2ede1" stroke="#d8d2c4" stroke-width="1.2"/>
<text x="355.0" y="95.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f2a4a">Skip repeats</text>
<text x="355.0" y="111.0" text-anchor="middle" font-size="11" fill="#16201f">DOIs sent before</text>
<text x="355.0" y="127.0" text-anchor="middle" font-size="11" fill="#16201f">(Sheets log)</text>
<rect x="436" y="70" width="118" height="74" rx="9" fill="#0f2a4a" stroke="#0f2a4a" stroke-width="1.2"/>
<text x="495.0" y="95.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Claude</text>
<text x="495.0" y="111.0" text-anchor="middle" font-size="11" fill="#dfe6ee">2 sentences from</text>
<text x="495.0" y="127.0" text-anchor="middle" font-size="11" fill="#dfe6ee">the abstract only</text>
<rect x="576" y="70" width="118" height="74" rx="9" fill="#f2ede1" stroke="#d8d2c4" stroke-width="1.2"/>
<text x="635.0" y="95.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f2a4a">Digest email</text>
<text x="635.0" y="111.0" text-anchor="middle" font-size="11" fill="#16201f">title, journal,</text>
<text x="635.0" y="127.0" text-anchor="middle" font-size="11" fill="#16201f">DOI, summary</text>
<rect x="716" y="70" width="118" height="74" rx="9" fill="#fbf4e6" stroke="#b8862e" stroke-width="2"/>
<text x="775.0" y="95.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5513">Reader checks</text>
<text x="775.0" y="111.0" text-anchor="middle" font-size="11" fill="#16201f">the journal and</text>
<text x="775.0" y="127.0" text-anchor="middle" font-size="11" fill="#16201f">the paper</text>
<line x1="134" y1="107.0" x2="153" y2="107.0" stroke="#55605e" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="274" y1="107.0" x2="293" y2="107.0" stroke="#55605e" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="414" y1="107.0" x2="433" y2="107.0" stroke="#55605e" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="554" y1="107.0" x2="573" y2="107.0" stroke="#55605e" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="694" y1="107.0" x2="713" y2="107.0" stroke="#55605e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="436" y="190" width="118" height="62" rx="9" fill="#f2ede1" stroke="#d8d2c4" stroke-width="1.2"/>
<text x="495.0" y="209.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f2a4a">No abstract</text>
<text x="495.0" y="225.0" text-anchor="middle" font-size="11" fill="#16201f">listed by title,</text>
<text x="495.0" y="241.0" text-anchor="middle" font-size="11" fill="#16201f">not summarised</text>
<path d="M355.0,144 L355.0,221 L433,221" fill="none" stroke="#55605e" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="4 3"/>
<path d="M554,221 L635.0,221 L635.0,147" fill="none" stroke="#55605e" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="4 3"/>
<text x="495.0" y="166" text-anchor="middle" font-size="10.5" fill="#b8862e">refusal: held for the</text>
<text x="495.0" y="179" text-anchor="middle" font-size="10.5" fill="#b8862e">research lead</text>
<text x="775.0" y="172" text-anchor="middle" font-size="11" fill="#b8862e">Not a quality filter.</text>
<rect x="20" y="272" width="12" height="12" rx="3" fill="#fbf4e6" stroke="#b8862e" stroke-width="2"/>
<text x="38" y="282" text-anchor="start" font-size="10.5" fill="#55605e">A person decides here</text>
</svg>
