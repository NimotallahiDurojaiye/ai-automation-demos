<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="860" height="300" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a1424"/></marker></defs>
<text x="20" y="38" font-size="19" font-weight="700" fill="#4a1424">06 Receipt reader</text>
<text x="20" y="62" font-size="13" fill="#5f5456">AI reads the receipt. Code checks the sums. A person clears anything flagged before it counts.</text>
<rect x="18" y="84" width="124" height="124" rx="10" fill="#ffffff" stroke="#d9d4d5" stroke-width="1.2"/>
<text x="30" y="106" font-size="11" font-weight="700" fill="#5f5456" letter-spacing="1">STEP 1</text>
<text x="30" y="126" font-size="13.5" font-weight="700" fill="#4a1424">Receipt to</text>
<text x="30" y="142" font-size="13.5" font-weight="700" fill="#4a1424">Drive folder</text>
<text x="30" y="162" font-size="11.5" fill="#1d1416">Photo or PDF,</text>
<text x="30" y="177" font-size="11.5" fill="#1d1416">emailed or</text>
<text x="30" y="192" font-size="11.5" fill="#1d1416">uploaded</text>
<line x1="144" y1="146.0" x2="155" y2="146.0" stroke="#4a1424" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="158" y="84" width="124" height="124" rx="10" fill="#ffffff" stroke="#4a1424" stroke-width="1.6"/>
<text x="170" y="106" font-size="11" font-weight="700" fill="#5f5456" letter-spacing="1">STEP 2</text>
<text x="170" y="126" font-size="13.5" font-weight="700" fill="#4a1424">Claude reads it</text>
<text x="170" y="146" font-size="11.5" fill="#1d1416">Returns JSON.</text>
<text x="170" y="161" font-size="11.5" fill="#1d1416">Null if unreadable,</text>
<text x="170" y="176" font-size="11.5" fill="#1d1416">never a guess.</text>
<line x1="284" y1="146.0" x2="295" y2="146.0" stroke="#4a1424" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="298" y="84" width="124" height="124" rx="10" fill="#ffffff" stroke="#d9d4d5" stroke-width="1.2"/>
<text x="310" y="106" font-size="11" font-weight="700" fill="#5f5456" letter-spacing="1">STEP 3</text>
<text x="310" y="126" font-size="13.5" font-weight="700" fill="#4a1424">Checks</text>
<text x="310" y="146" font-size="11.5" fill="#1d1416">Total vs items,</text>
<text x="310" y="161" font-size="11.5" fill="#1d1416">missing total,</text>
<text x="310" y="176" font-size="11.5" fill="#1d1416">low confidence</text>
<line x1="424" y1="146.0" x2="435" y2="146.0" stroke="#4a1424" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="438" y="84" width="124" height="124" rx="10" fill="#ffffff" stroke="#d9d4d5" stroke-width="1.2"/>
<text x="450" y="106" font-size="11" font-weight="700" fill="#5f5456" letter-spacing="1">STEP 4</text>
<text x="450" y="126" font-size="13.5" font-weight="700" fill="#4a1424">Bookkeeping</text>
<text x="450" y="142" font-size="13.5" font-weight="700" fill="#4a1424">log</text>
<text x="450" y="162" font-size="11.5" fill="#1d1416">New row. Sheet</text>
<text x="450" y="177" font-size="11.5" fill="#1d1416">formula spots</text>
<text x="450" y="192" font-size="11.5" fill="#1d1416">duplicates.</text>
<line x1="564" y1="146.0" x2="575" y2="146.0" stroke="#4a1424" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="578" y="84" width="124" height="124" rx="10" fill="#ffffff" stroke="#b3202a" stroke-width="2"/>
<text x="590" y="106" font-size="11" font-weight="700" fill="#5f5456" letter-spacing="1">STEP 5</text>
<text x="590" y="126" font-size="13.5" font-weight="700" fill="#b3202a">Person checks</text>
<text x="590" y="142" font-size="13.5" font-weight="700" fill="#b3202a">flagged rows</text>
<text x="590" y="162" font-size="11.5" fill="#1d1416">Opens the receipt,</text>
<text x="590" y="177" font-size="11.5" fill="#1d1416">corrects the row,</text>
<text x="590" y="192" font-size="11.5" fill="#1d1416">adds initials</text>
<line x1="704" y1="146.0" x2="715" y2="146.0" stroke="#4a1424" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="718" y="84" width="124" height="124" rx="10" fill="#ffffff" stroke="#d9d4d5" stroke-width="1.2"/>
<text x="730" y="106" font-size="11" font-weight="700" fill="#5f5456" letter-spacing="1">STEP 6</text>
<text x="730" y="126" font-size="13.5" font-weight="700" fill="#4a1424">Counts in</text>
<text x="730" y="142" font-size="13.5" font-weight="700" fill="#4a1424">totals</text>
<text x="730" y="162" font-size="11.5" fill="#1d1416">Only OK or</text>
<text x="730" y="177" font-size="11.5" fill="#1d1416">checked rows are</text>
<text x="730" y="192" font-size="11.5" fill="#1d1416">summed</text>
<line x1="220.0" y1="210" x2="220.0" y2="234" stroke="#5f5456" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
<rect x="160.0" y="238" width="430" height="40" rx="8" fill="#ffffff" stroke="#d9d4d5"/>
<text x="172.0" y="254" font-size="11.5" fill="#5f5456">Refusal or API error: a blank row with the file link is added</text>
<text x="172.0" y="269" font-size="11.5" fill="#5f5456">and the bookkeeper is emailed to type it by hand.</text>
<rect x="480" y="14" width="12" height="12" rx="3" fill="#ffffff" stroke="#4a1424" stroke-width="1.6"/>
<text x="498" y="24" font-size="11.5" fill="#5f5456">AI step</text>
<rect x="560" y="14" width="12" height="12" rx="3" fill="#ffffff" stroke="#b3202a" stroke-width="2"/>
<text x="578" y="24" font-size="11.5" fill="#5f5456">Human review</text>
<rect x="680" y="14" width="12" height="12" rx="3" fill="#ffffff" stroke="#d9d4d5"/>
<text x="698" y="24" font-size="11.5" fill="#5f5456">Code, formulas or Make</text>
</svg>