<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f5456"/>
    </marker>
  </defs>
  <rect width="860" height="300" fill="#ffffff"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#4a1424">02 Fair CV shortlister</text>
  <text x="20" y="48" font-size="11" fill="#5f5456">The AI never sees who the applicant is, and never rejects anyone.</text>

  <!-- 1 -->
  <rect x="20" y="105" width="120" height="80" rx="8" fill="#ffffff" stroke="#d9d4d5"/>
  <text x="80" y="134" font-size="12" font-weight="700" fill="#1d1416" text-anchor="middle">Application</text>
  <text x="80" y="152" font-size="10.5" fill="#5f5456" text-anchor="middle">form row with</text>
  <text x="80" y="166" font-size="10.5" fill="#5f5456" text-anchor="middle">CV text pasted</text>

  <!-- 2 -->
  <rect x="160" y="105" width="120" height="80" rx="8" fill="#ffffff" stroke="#d9d4d5"/>
  <text x="220" y="134" font-size="12" font-weight="700" fill="#1d1416" text-anchor="middle">Make masks</text>
  <text x="220" y="152" font-size="10.5" fill="#5f5456" text-anchor="middle">name, email, phone</text>
  <text x="220" y="166" font-size="10.5" fill="#5f5456" text-anchor="middle">adds a blind ID</text>

  <!-- 3 -->
  <rect x="300" y="105" width="120" height="80" rx="8" fill="#4a1424" stroke="#4a1424"/>
  <text x="360" y="134" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Claude call 1</text>
  <text x="360" y="152" font-size="10.5" fill="#ffffff" text-anchor="middle">removes any other</text>
  <text x="360" y="166" font-size="10.5" fill="#ffffff" text-anchor="middle">identifiers</text>

  <!-- 4 -->
  <rect x="440" y="105" width="120" height="80" rx="8" fill="#4a1424" stroke="#4a1424"/>
  <text x="500" y="134" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Claude call 2</text>
  <text x="500" y="152" font-size="10.5" fill="#ffffff" text-anchor="middle">scores 5 criteria,</text>
  <text x="500" y="166" font-size="10.5" fill="#ffffff" text-anchor="middle">quotes evidence</text>

  <!-- 5 -->
  <rect x="580" y="105" width="120" height="80" rx="8" fill="#ffffff" stroke="#d9d4d5"/>
  <text x="640" y="134" font-size="12" font-weight="700" fill="#1d1416" text-anchor="middle">Shortlist sheet</text>
  <text x="640" y="152" font-size="10.5" fill="#5f5456" text-anchor="middle">Make adds totals,</text>
  <text x="640" y="166" font-size="10.5" fill="#5f5456" text-anchor="middle">checks quotes</text>

  <!-- 6 human -->
  <rect x="720" y="105" width="120" height="80" rx="8" fill="#b3202a" stroke="#b3202a"/>
  <text x="780" y="134" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Recruiter decides</text>
  <text x="780" y="152" font-size="10.5" fill="#ffffff" text-anchor="middle">reads evidence,</text>
  <text x="780" y="166" font-size="10.5" fill="#ffffff" text-anchor="middle">judges gaps</text>

  <!-- side stores -->
  <rect x="160" y="225" width="120" height="44" rx="8" fill="#ffffff" stroke="#d9d4d5"/>
  <text x="220" y="244" font-size="11.5" font-weight="700" fill="#1d1416" text-anchor="middle">ID map</text>
  <text x="220" y="259" font-size="10.5" fill="#5f5456" text-anchor="middle">recruiter only</text>

  <rect x="370" y="225" width="120" height="44" rx="8" fill="#ffffff" stroke="#d9d4d5"/>
  <text x="430" y="244" font-size="11.5" font-weight="700" fill="#1d1416" text-anchor="middle">Needs human</text>
  <text x="430" y="259" font-size="10.5" fill="#5f5456" text-anchor="middle">refusal or error</text>

  <!-- arrows -->
  <line x1="140" y1="145" x2="156" y2="145" stroke="#5f5456" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="280" y1="145" x2="296" y2="145" stroke="#5f5456" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="420" y1="145" x2="436" y2="145" stroke="#5f5456" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="560" y1="145" x2="576" y2="145" stroke="#5f5456" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="700" y1="145" x2="716" y2="145" stroke="#5f5456" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="220" y1="185" x2="220" y2="221" stroke="#5f5456" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <path d="M360,185 L360,205 L410,205 L410,221" fill="none" stroke="#5f5456" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <path d="M500,185 L500,205 L450,205 L450,221" fill="none" stroke="#5f5456" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <path d="M780,185 L780,285 L250,285 L250,273" fill="none" stroke="#b3202a" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arr)"/>
  <text x="620" y="280" font-size="10" fill="#5f5456" text-anchor="middle">names looked up only after review</text>
</svg>
